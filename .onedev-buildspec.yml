version: 59
jobs:
- name: ClyoCloudAndroid CI
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build ClyoCloudAndroid
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        export ANDROID_SDK_ROOT=/opt/android-sdk
        export ANDROID_HOME=/opt/android-sdk
        ./gradlew assembleDebug
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: Publish ClyoCloudAndroid APK
    sourcePath: app/build/outputs/apk/debug
    artifacts: '*'
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
- name: Mirror to GitHub
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: PushRepository
    name: push to github.com/WeeXnes/ClyoCloud.Android
    remoteUrl: https://github.com/WeeXnes/ClyoCloud.Android.git
    userName: WeeXnes
    passwordSecret: github-mirror-token
    force: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: TagCreateTrigger
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
